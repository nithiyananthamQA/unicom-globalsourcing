<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d6d" />
    <link rel="icon" type="image/png" href="/src/assets/ugs-logo-icon.png" />

    <!-- Preconnect to media origins so DNS+TLS handshakes happen early -->
    <link rel="preconnect" href="https://videos.pexels.com" crossorigin />
    <link rel="preconnect" href="https://media.giphy.com" crossorigin />
    <link rel="dns-prefetch" href="https://videos.pexels.com" />
    <link rel="dns-prefetch" href="https://media.giphy.com" />

    <!-- Preload the hero video on the homepage so byte-fetch runs in
         parallel with the JS bundle download -->
    <link
      rel="preload"
      as="video"
      type="video/mp4"
      href="https://videos.pexels.com/video-files/31370995/13386620_2560_1440_50fps.mp4"
      fetchpriority="high"
    />

    <meta name="author" content="UNICOM GLOBALSOURCING PRIVATE LIMITED" />
    <meta name="keywords" content="textile sourcing India, Coimbatore sourcing partner, hospitality linens, garment manufacturing India, home textiles, textile supply chain, UGS Unicom Globalsourcing" />
    <title>UGS — Unicom Globalsourcing | Strategic Sourcing & Supply Chain Partner</title>
    <meta name="description" content="UNICOM GLOBALSOURCING (UGS) — Coimbatore-based strategic sourcing & supply chain partner connecting global buyers with India's premier textile manufacturers." />

    <!-- JSON-LD: Organization schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "UNICOM GLOBALSOURCING PRIVATE LIMITED",
      "alternateName": "UGS",
      "url": "https://unicomglobalsourcing.com",
      "logo": "https://unicomglobalsourcing.com/src/assets/ugs-logo-full.png",
      "foundingDate": "2024-06",
      "description": "Strategic sourcing and supply chain partner connecting global buyers with India's premier textile manufacturing capabilities.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Coimbatore",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-97319-13106",
        "email": "arun@unicomglobalsourcing.com",
        "contactType": "Sales"
      }
    }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
